services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edvexa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edvexa}
      POSTGRES_DB: ${POSTGRES_DB:-edvexa}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ so the variables are expanded by the container's shell, not by
      # Compose, which would substitute empty strings and probe the wrong user.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
